org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
# Plugin sources live in versioned pub-cache paths, while their build directories keep the same
# name across versions. Kotlin incremental compilation then reuses stale state after a plugin
# upgrade and reports bogus "Unresolved reference" errors. Plugins only change on upgrades, so
# full recompilation costs little.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
