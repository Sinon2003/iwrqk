name: Build Release (Android)

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  APP_PACK_NAME: iwrqk

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      # Without the signing secrets, APKs would be signed with a throwaway key
      # and could not update existing installs, so nothing is built.
      - name: Decode keystore
        id: keystore
        run: |
          if [ -z "$ENCODED_KEYSTORE" ]; then
            echo "::notice::No signing key configured; skipping the Android build."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ENCODED_KEYSTORE" | base64 -di > "${{ github.workspace }}/android/app/keystore.jks"
          ls -l "${{ github.workspace }}/android/app/keystore.jks"
          echo "configured=true" >> "$GITHUB_OUTPUT"
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODED_KEYSTORE }}

      - name: Flutter pub get
        if: steps.keystore.outputs.configured == 'true'
        run: flutter pub get

      - name: Get app version
        if: steps.keystore.outputs.configured == 'true'
        id: get_version
        shell: bash
        run: |
          echo "version=$(grep -m1 version: pubspec.yaml | awk '{print $2}' | sed 's/\"//g')" >> $GITHUB_OUTPUT

      - name: Build APK (release)
        if: steps.keystore.outputs.configured == 'true'
        run: flutter build apk --release
        env:
          KEYSTORE: ${{ github.workspace }}/android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact (manual trigger)
        if: steps.keystore.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/apk/release/*.apk

      - name: Publish release (append APK)
        if: steps.keystore.outputs.configured == 'true' && github.event_name != 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "build/app/outputs/apk/release/*.apk"
          allowUpdates: true
          prerelease: contains(github.ref, 'pre')
          artifactErrorsFailBuild: true
          removeArtifacts: false
